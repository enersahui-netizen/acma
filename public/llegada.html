<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juez de Llegada</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .reloj { font-size: 2.5rem; color: #ff3366; text-align: center; margin: 20px 0; font-family: monospace; }
        .estado { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .online { background-color: #28a745; color: white; }
        .offline { background-color: #dc3545; color: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .btn-llegada { width: 100%; padding: 15px; background: #ff3366; color: #fff; font-weight: bold; font-size: 1.2rem; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #333; }
        th { color: #888; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏁 LLEGADA</h2>
        <span id="indicador-estado" class="estado offline">OFFLINE</span>
    </div>

    <div class="reloj" id="reloj-oficial">00:00:00</div>

    <div class="form-group">
        <label>TRAMO (PE):</label>
        <input type="text" id="tramo" value="PE-01">
    </div>

    <div class="form-group">
        <label>N° DE VEHÍCULO (AUTO):</label>
        <input type="number" id="num_auto" placeholder="Ej: 402">
    </div>

    <button class="btn-llegada" onclick="registrarLlegada()">🛑 REGISTRAR LLEGADA</button>

    <h3>REGISTRADOS EN ESTE CELULAR</h3>
    <table>
        <thead>
            <tr>
                <th>Auto</th>
                <th>Hora Llegada</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="historial-body"></tbody>
    </table>

    <script>
        const URL_SERVIDOR = "https://acma-baf9.onrender.com";

        // Corregida la lectura limpia de localStorage
        let historialLocal = JSON.parse(localStorage.getItem('llegadas_local') || "[]");

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj-oficial').innerText = ahora.toTimeString().split(' ')[0];
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        async function comprobarConexion() {
            const badge = document.getElementById('indicador-estado');
            try {
                const res = await fetch(`${URL_SERVIDOR}/`, { method: 'HEAD' });
                if (res.ok) {
                    badge.innerText = "ONLINE";
                    badge.className = "estado online";
                    sincronizarPendientes();
                } else {
                    throw new Error();
                }
            } catch (e) {
                badge.innerText = "OFFLINE";
                badge.className = "estado offline";
            }
        }

        async function registrarLlegada() {
            const auto = document.getElementById('num_auto').value;
            const tramo = document.getElementById('tramo').value;

            if (!auto) {
                alert("Por favor ingrese el número del vehículo");
                return;
            }

            const registro = {
                id: Date.now(),
                auto: auto,
                tramo: tramo,
                hora: new Date().toLocaleTimeString('es-PE', { hour12: false }) + '.' + new Date().getMilliseconds().toString().padStart(3, '0'),
                enviado: false
            };

            historialLocal.unshift(registro);
            guardarYRenderizar();
            document.getElementById('num_auto').value = '';

            await sincronizarPendientes();
        }

        async function sincronizarPendientes() {
            for (let item of historialLocal) {
                if (!item.enviado) {
                    try {
                        const res = await fetch(`${URL_SERVIDOR}/api/llegada`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(item)
                        });
                        if (res.ok) {
                            item.enviado = true;
                        }
                    } catch (e) {
                        break; // Si falla uno, detiene la sincronización hasta recuperar conexión
                    }
                }
            }
            guardarYRenderizar();
        }

        function guardarYRenderizar() {
            localStorage.setItem('llegadas_local', JSON.stringify(historialLocal));
            const tbody = document.getElementById('historial-body');
            tbody.innerHTML = '';
            historialLocal.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${item.auto}</td>
                    <td>${item.hora}</td>
                    <td>${item.enviado ? '✅ Enviado' : '⏳ Pendiente'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        setInterval(comprobarConexion, 5000);
        guardarYRenderizar();
        comprobarConexion();
    </script>
</body>
</html>
