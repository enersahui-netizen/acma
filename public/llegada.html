<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llegada - Cronometraje</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 15px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-bottom: 3px solid #ffeb3b; }
    .badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; background: #ff9100; color: #000; }
    .badge.online { background: #00e676; }
    .btn-meta { width: 100%; padding: 35px 10px; background: linear-gradient(135deg, #ffeb3b, #ff9100); color: #000; border: none; border-radius: 16px; font-size: 32px; font-weight: 900; text-transform: uppercase; box-shadow: 0 4px 20px rgba(255, 235, 59, 0.3); margin-bottom: 20px; cursor: pointer; }
    .btn-meta:active { transform: scale(0.96); background: #00e676; }
    .panel-asignacion { background: #222; border: 1px solid #444; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-size: 13px; color: #aaa; }
    input { width: 100%; padding: 12px; background: #111; border: 1px solid #555; border-radius: 8px; color: #fff; font-size: 18px; }
    .btn-confirmar { width: 100%; padding: 15px; background: #00e676; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .tabla-historial { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 20px; }
    .tabla-historial th, .tabla-historial td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
    .tabla-historial th { background: #222; color: #aaa; }
  </style>
</head>
<body>

  <div class="header">
    <h3>🏁 LLEGADA / META</h3>
    <span id="estado-red" class="badge">OFFLINE</span>
  </div>

  <div class="form-group">
    <label>TRAMO (PE):</label>
    <input type="text" id="tramo" value="PE-01">
  </div>

  <button class="btn-meta" onclick="capturarMeta()">⏱️ ¡CRUZÓ META!</button>

  <div id="panel-asignacion" class="panel-asignacion">
    <h3 style="color: #ffeb3b; margin-bottom: 10px;">📝 Asignar Vehículo</h3>
    <p id="txt-hora-capturada" style="font-family: monospace; font-size: 16px; margin-bottom: 10px; color: #00e676;"></p>

    <div class="form-group">
      <label>N° DE VEHÍCULO (AUTO):</label>
      <input type="number" id="num-auto" placeholder="Ej: 402" inputmode="numeric">
    </div>

    <div class="form-group">
      <label>PENALIZACIÓN (Segundos):</label>
      <input type="number" id="penalizacion" value="0" inputmode="numeric">
    </div>

    <div class="form-group">
      <label>MOTIVO / OBSERVACIÓN:</label>
      <input type="text" id="observacion" placeholder="Ej: Toque de chicana">
    </div>

    <button class="btn-confirmar" onclick="guardarLlegada()">✅ Confirmar Registro</button>
  </div>

  <h4 style="color: #aaa; margin-top: 20px;">ÚLTIMAS LLEGADAS EN ESTE CELULAR</h4>
  <table class="tabla-historial">
    <thead>
      <tr>
        <th>Auto</th>
        <th>Hora Paso</th>
        <th>Pen.</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="historial-body"></tbody>
  </table>

  <script>
    // CAMBIA ESTA URL POR LA DIRECCIÓN DE NGROK CUANDO CONECTES CON LA LAPTOP
    const URL_SERVIDOR = "https://acma-baf9.onrender.com"; 
    
    let historialLocal = JSON.parse(localStorage.getItem('llegadas_local') || '[]');
    let ultimaCaptura = null;

    function capturarMeta() {
      const ahora = new Date();
      const pad = (n, z = 2) => n.toString().padStart(z, '0');
      const padMs = (n) => n.toString().padStart(3, '0');
      
      const horaFormateada = `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}:${pad(ahora.getSeconds())}.${padMs(ahora.getMilliseconds())}`;
      
      ultimaCaptura = {
        hora_llegada: horaFormateada,
        ms_llegada: ahora.getTime()
      };

      document.getElementById('txt-hora-capturada').innerText = `Tiempo Capturado: ${horaFormateada}`;
      document.getElementById('panel-asignacion').style.display = 'block';
      document.getElementById('num-auto').focus();
    }

    function guardarLlegada() {
      const numAuto = document.getElementById('num-auto').value;
      const tramo = document.getElementById('tramo').value;
      const penalizacion = document.getElementById('penalizacion').value || 0;
      const observacion = document.getElementById('observacion').value || 'Sin observaciones';

      if (!numAuto) {
        alert("Por favor, ingresa el número de auto.");
        return;
      }

      const registro = {
        tramo_id: tramo,
        auto: numAuto,
        hora_llegada: ultimaCaptura.hora_llegada,
        ms_llegada: ultimaCaptura.ms_llegada,
        penalizacion_seg: parseInt(penalizacion),
        observacion: observacion,
        enviado: false
      };

      historialLocal.unshift(registro);
      localStorage.setItem('llegadas_local', JSON.stringify(historialLocal));
      
      actualizarTabla();

      // Limpiar interfaz
      document.getElementById('panel-asignacion').style.display = 'none';
      document.getElementById('num-auto').value = '';
      document.getElementById('penalizacion').value = '0';
      document.getElementById('observacion').value = '';

      enviarAlServidor(registro);
    }

    async function enviarAlServidor(registro) {
      try {
        const respuesta = await fetch(`${URL_SERVIDOR}/api/llegada`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(registro)
        });

        if (respuesta.ok) {
          registro.enviado = true;
          document.getElementById('estado-red').innerText = "ONLINE";
          document.getElementById('estado-red').className = "badge online";
          localStorage.setItem('llegadas_local', JSON.stringify(historialLocal));
          actualizarTabla();
        }
      } catch (e) {
        document.getElementById('estado-red').innerText = "OFFLINE";
        document.getElementById('estado-red').className = "badge";
      }
    }

    function actualizarTabla() {
      const body = document.getElementById('historial-body');
      body.innerHTML = '';
      historialLocal.forEach(reg => {
        const fila = `<tr>
          <td><b>#${reg.auto}</b></td>
          <td>${reg.hora_llegada}</td>
          <td>+${reg.penalizacion_seg}s</td>
          <td>${reg.enviado ? '✅ Recibido' : '⏳ Pendiente'}</td>
        </tr>`;
        body.innerHTML += fila;
      });
    }

    actualizarTabla();
  </script>
</body>
</html>
