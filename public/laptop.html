<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACMA - Director de Carrera</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #334155; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        h1 { color: #38bdf8; margin: 0; font-size: 1.4rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 15px; border: 1px solid #334155; }
        .badge-partida { color: #4ade80; }
        .badge-llegada { color: #f43f5e; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        tr:nth-child(even) { background: #182234; }
        .btn-danger { 
            background: #dc2626; 
            color: white; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .btn-inicio { 
            background: #334155; 
            color: white; 
            padding: 8px 14px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            margin-left: 10px; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>💻 CONTROL EN VIVO - DIRECTOR DE CARRERA</h1>
        <div>
            <button class="btn-danger" onclick="limpiarTodo()">🗑️ LIMPIAR DATOS</button>
            <a class="btn-inicio" href="/">📱 IR A MÓVIL</a>
        </div>
    </div>

    <!-- TABLAS EN VIVO -->
    <div class="grid">
        <div class="card">
            <h2 class="badge-partida">🟢 PARTIDAS (<span id="cnt-partidas">0</span>)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Auto</th>
                        <th>Tramo</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="t-partidas">
                    <tr><td colspan="3">Sin datos registrados</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2 class="badge-llegada">🛑 LLEGADAS (<span id="cnt-llegadas">0</span>)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Auto</th>
                        <th>Tramo</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="t-llegadas">
                    <tr><td colspan="3">Sin datos registrados</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Obtener datos en tiempo real del servidor
        async function cargarDatos() {
            try {
                const res = await fetch('/api/obtener-datos-vivo');
                const data = await res.json();

                document.getElementById('cnt-partidas').innerText = data.partidas.length;
                document.getElementById('t-partidas').innerHTML = data.partidas.length === 0
                    ? '<tr><td colspan="3">Sin datos registrados</td></tr>'
                    : data.partidas.map(p => `<tr><td><b>#${p.auto}</b></td><td>${p.tramo}</td><td>${p.hora}</td></tr>`).join('');

                document.getElementById('cnt-llegadas').innerText = data.llegadas.length;
                document.getElementById('t-llegadas').innerHTML = data.llegadas.length === 0
                    ? '<tr><td colspan="3">Sin datos registrados</td></tr>'
                    : data.llegadas.map(l => `<tr><td><b>#${l.auto}</b></td><td>${l.tramo}</td><td>${l.hora}</td></tr>`).join('');

            } catch (e) {
                console.error("Error obteniendo datos:", e);
            }
        }

        // Limpiar partidas y llegadas del servidor
        async function limpiarTodo() {
            if (confirm("¿Estás seguro de reiniciar los tiempos de partidas y llegadas?")) {
                await fetch('/api/limpiar-todo', { method: 'POST' });
                cargarDatos();
            }
        }

        // Actualización automática cada 3 segundos
        setInterval(cargarDatos, 3000);
        cargarDatos();
    </script>
</body>
</html>
