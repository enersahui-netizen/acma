<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Director de Carrera</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 15px; border: 1px solid #334155; }
        .card h2 { margin-top: 0; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .badge-partida { color: #4ade80; }
        .badge-llegada { color: #f43f5e; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        tr:nth-child(even) { background: #182234; }
        .respaldos-section { margin-top: 25px; }
        .btn-descargar { background: #3b82f6; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 0.8rem; }
        .indicador { font-size: 0.8rem; padding: 4px 8px; border-radius: 12px; background: #0284c7; color: white; }
    </style>
</head>
<body>

    <h1>💻 CONTROL GENERAL EN VIVO - DIRECTOR DE CARRERA</h1>

    <div class="grid">
        <!-- TABLA DE PARTIDAS -->
        <div class="card">
            <h2 class="badge-partida">🟢 PARTIDAS <span class="indicador" id="total-partidas">0</span></h2>
            <table>
                <thead>
                    <tr>
                        <th>Auto</th>
                        <th>Tramo</th>
                        <th>Categoría</th>
                        <th>Hora Partida</th>
                    </tr>
                </thead>
                <tbody id="tabla-partidas">
                    <tr><td colspan="4">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- TABLA DE LLEGADAS -->
        <div class="card">
            <h2 class="badge-llegada">🛑 LLEGADAS <span class="indicador" id="total-llegadas">0</span></h2>
            <table>
                <thead>
                    <tr>
                        <th>Auto</th>
                        <th>Tramo</th>
                        <th>Hora Llegada</th>
                    </tr>
                </thead>
                <tbody id="tabla-llegadas">
                    <tr><td colspan="3">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN DE ARCHIVOS EXCEL RESPALDADOS -->
    <div class="card respaldos-section">
        <h2>📦 ARCHIVOS EXCEL RESPALDADOS EN SERVIDOR (.XLSX)</h2>
        <ul id="lista-archivos">
            <li>Buscando respaldos...</li>
        </ul>
    </div>

    <script>
        async function cargarDatosVivo() {
            try {
                const res = await fetch(`/api/obtener-datos-vivo`);
                const data = await res.json();

                // Renderizar Partidas
                const tbodyPartidas = document.getElementById('tabla-partidas');
                document.getElementById('total-partidas').innerText = data.partidas.length;
                if (data.partidas.length === 0) {
                    tbodyPartidas.innerHTML = '<tr><td colspan="4">Sin partidas registradas aún.</td></tr>';
                } else {
                    tbodyPartidas.innerHTML = data.partidas.map(p => `
                        <tr>
                            <td><b>#${p.auto}</b></td>
                            <td>${p.tramo}</td>
                            <td>${p.categoria || 'N/A'}</td>
                            <td>${p.hora}</td>
                        </tr>
                    `).join('');
                }

                // Renderizar Llegadas
                const tbodyLlegadas = document.getElementById('tabla-llegadas');
                document.getElementById('total-llegadas').innerText = data.llegadas.length;
                if (data.llegadas.length === 0) {
                    tbodyLlegadas.innerHTML = '<tr><td colspan="3">Sin llegadas registradas aún.</td></tr>';
                } else {
                    tbodyLlegadas.innerHTML = data.llegadas.map(l => `
                        <tr>
                            <td><b>#${l.auto}</b></td>
                            <td>${l.tramo}</td>
                            <td>${l.hora}</td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error("Error al obtener datos en vivo:", e);
            }
        }

        async function cargarListaRespaldos() {
            try {
                const res = await fetch(`/api/lista-respaldos`);
                const archivos = await res.json();

                const ul = document.getElementById('lista-archivos');
                if (archivos.length === 0) {
                    ul.innerHTML = '<li>No hay archivos respaldados en el servidor todavía.</li>';
                } else {
                    ul.innerHTML = archivos.map(a => `
                        <li style="margin-bottom: 8px;">
                            📄 <b>${a}</b> 
                            <a class="btn-descargar" href="/api/descargar-respaldo/${a}" target="_blank">📥 Descargar .xlsx</a>
                        </li>
                    `).join('');
                }
            } catch (e) {
                console.error("Error cargando archivos respaldados:", e);
            }
        }

        // Actualizar datos automáticamente cada 3 segundos
        setInterval(() => {
            cargarDatosVivo();
            cargarListaRespaldos();
        }, 3000);

        // Carga inicial
        cargarDatosVivo();
        cargarListaRespaldos();
    </script>
</body>
</html>
