<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACMA - Director de Carrera</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b132b; color: #f8fafc; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #38bdf8; margin: 0; font-size: 1.3rem; letter-spacing: 0.5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #111c38; border-radius: 8px; padding: 15px; border: 1px solid #1e293b; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge-partida { color: #4ade80; font-size: 1.1rem; margin: 0; }
        .badge-llegada { color: #f43f5e; font-size: 1.1rem; margin: 0; }
        .counter { font-weight: bold; font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.85rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #1e293b; }
        th { background: #0b132b; color: #94a3b8; font-weight: bold; }
        tr:nth-child(even) { background: #172445; }
        .respaldos-card { background: #111c38; border-radius: 8px; padding: 15px; border: 1px solid #1e293b; }
        .respaldos-title { color: #f8fafc; font-size: 0.95rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .respaldos-list { margin: 0; padding-left: 20px; font-size: 0.85rem; color: #cbd5e1; }
        .respaldos-list li { margin-bottom: 5px; }
        .respaldos-list a { color: #38bdf8; text-decoration: none; }
        .respaldos-list a:hover { text-decoration: underline; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-inicio { background: #1e293b; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 0.85rem; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>💻 CONTROL EN VIVO - DIRECTOR DE CARRERA</h1>
        <div>
            <button class="btn-danger" onclick="limpiarTodo()">🗑️ LIMPIAR DATOS</button>
            <a class="btn-inicio" href="/">📱 IR A INICIO</a>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-header">
                <h2 class="badge-partida">🟢 PARTIDAS</h2>
                <span class="badge-partida counter" id="cnt-partidas">0</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Auto</th>
                        <th>Tramo</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="t-partidas">
                    <tr><td colspan="3">Sin datos registrados</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="badge-llegada">🛑 LLEGADAS</h2>
                <span class="badge-llegada counter" id="cnt-llegadas">0</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Auto</th>
                        <th>Tramo</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="t-llegadas">
                    <tr><td colspan="3">Sin datos registrados</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="respaldos-card">
        <div class="respaldos-title">📦 RESPALDOS EXCEL EN EL SERVIDOR (.XLSX)</div>
        <ul class="respaldos-list" id="lista-respaldos">
            <li>No hay respaldos todavía.</li>
        </ul>
    </div>

    <script>
        async function cargarDatos() {
            try {
                const res = await fetch('/api/obtener-datos-vivo');
                const data = await res.json();

                document.getElementById('cnt-partidas').innerText = data.partidas.length;
                document.getElementById('t-partidas').innerHTML = data.partidas.length === 0
                    ? '<tr><td colspan="3">Sin datos registrados</td></tr>'
                    : data.partidas.map(p => `<tr><td><b>#${p.auto}</b></td><td>${p.tramo}</td><td>${p.hora}</td></tr>`).join('');

                document.getElementById('cnt-llegadas').innerText = data.llegadas.length;
                document.getElementById('t-llegadas').innerHTML = data.llegadas.length === 0
                    ? '<tr><td colspan="3">Sin datos registrados</td></tr>'
                    : data.llegadas.map(l => `<tr><td><b>#${l.auto}</b></td><td>${l.tramo}</td><td>${l.hora}</td></tr>`).join('');

                const elemRespaldos = document.getElementById('lista-respaldos');
                if (data.respaldos && data.respaldos.length > 0) {
                    elemRespaldos.innerHTML = data.respaldos.map(r => 
                        `<li><a href="/respaldos/${r}" download>${r}</a></li>`
                    ).join('');
                } else {
                    elemRespaldos.innerHTML = '<li>No hay respaldos todavía.</li>';
                }

            } catch (e) {
                console.error("Error cargando datos:", e);
            }
        }

        async function limpiarTodo() {
            if (confirm("¿Estás seguro de reiniciar los tiempos de partidas y llegadas?")) {
                await fetch('/api/limpiar-todo', { method: 'POST' });
                cargarDatos();
            }
        }

        setInterval(cargarDatos, 3000);
        cargarDatos();
    </script>
</body>
</html>
