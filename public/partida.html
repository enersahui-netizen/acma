<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juez de Partida</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .reloj { font-size: 2.5rem; color: #00ff66; text-align: center; margin: 20px 0; font-family: monospace; }
        .estado { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .online { background-color: #28a745; color: white; }
        .offline { background-color: #dc3545; color: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input, select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .btn-partida { width: 100%; padding: 15px; background: #00ff66; color: #000; font-weight: bold; font-size: 1.2rem; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-csv { width: 100%; padding: 12px; background: #17a2b8; color: #fff; font-weight: bold; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #333; }
        th { color: #888; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏁 PARTIDA</h2>
        <span id="indicador-estado" class="estado offline">OFFLINE</span>
    </div>

    <div class="reloj" id="reloj-oficial">00:00:00</div>

    <div class="form-group">
        <label>TRAMO (PE):</label>
        <input type="text" id="tramo" value="PE-01">
    </div>

    <div class="form-group">
        <label>N° DE VEHÍCULO (AUTO):</label>
        <input type="number" id="num_auto" placeholder="Ej: 402">
    </div>

    <div class="form-group">
        <label>CATEGORÍA DEL VEHÍCULO:</label>
        <select id="categoria">
            <option value="General / Libre">General / Libre</option>
            <option value="Turismo 1600cc">Turismo 1600cc</option>
            <option value="S1600">S1600</option>
        </select>
    </div>

    <button class="btn-partida" onclick="darLargada()">🟢 DAR LARGADA</button>
    <button class="btn-csv" onclick="procesarCSV()">📥 DESCARGAR / ENVIAR CSV RESPALDO</button>

    <h3>REGISTRADOS EN ESTE CELULAR</h3>
    <table>
        <thead>
            <tr>
                <th>Auto</th>
                <th>Cat.</th>
                <th>Hora Partida</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="historial-body"></tbody>
    </table>

    <script>
        const URL_SERVIDOR = "https://acma-baf9.onrender.com";
        let historialLocal = JSON.parse(localStorage.getItem('partidas_local') || "[]");

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj-oficial').innerText = ahora.toTimeString().split(' ')[0];
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        async function comprobarConexion() {
            const badge = document.getElementById('indicador-estado');
            try {
                const res = await fetch(`${URL_SERVIDOR}/`, { method: 'HEAD' });
                if (res.ok) {
                    badge.innerText = "ONLINE";
                    badge.className = "estado online";
                    sincronizarPendientes();
                } else { throw new Error(); }
            } catch (e) {
                badge.innerText = "OFFLINE";
                badge.className = "estado offline";
            }
        }

        async function darLargada() {
            const auto = document.getElementById('num_auto').value;
            const tramo = document.getElementById('tramo').value;
            const categoria = document.getElementById('categoria').value;

            if (!auto) { alert("Por favor ingrese el número del vehículo"); return; }

            const registro = {
                id: Date.now(),
                auto: auto,
                tramo: tramo,
                categoria: categoria,
                hora: new Date().toLocaleTimeString('es-PE', { hour12: false }) + '.' + new Date().getMilliseconds().toString().padStart(3, '0'),
                enviado: false
            };

            historialLocal.unshift(registro);
            guardarYRenderizar();
            document.getElementById('num_auto').value = '';
            await sincronizarPendientes();
        }

        async function sincronizarPendientes() {
            for (let item of historialLocal) {
                if (!item.enviado) {
                    try {
                        const res = await fetch(`${URL_SERVIDOR}/api/partida`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(item)
                        });
                        if (res.ok) { item.enviado = true; }
                    } catch (e) { break; }
                }
            }
            guardarYRenderizar();
        }

        function guardarYRenderizar() {
            localStorage.setItem('partidas_local', JSON.stringify(historialLocal));
            const tbody = document.getElementById('historial-body');
            tbody.innerHTML = '';
            historialLocal.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${item.auto}</td>
                    <td>${item.categoria}</td>
                    <td>${item.hora}</td>
                    <td>${item.enviado ? '✅ Enviado' : '⏳ Pendiente'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function procesarCSV() {
            if (historialLocal.length === 0) {
                alert("No hay registros para exportar.");
                return;
            }

            const tramo = document.getElementById('tramo').value || 'PE-01';
            const nombreArchivo = `${tramo.toLowerCase()}-partida.csv`;

            let csvContent = "\uFEFFAuto,Categoria,Tramo,Hora_Partida,Estado\n";
            historialLocal.forEach(item => {
                const estado = item.enviado ? "Enviado" : "Pendiente";
                csvContent += `"${item.auto}","${item.categoria || ''}","${item.tramo}","${item.hora}","${estado}"\n`;
            });

            // 1. Descarga Local en Celular
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nombreArchivo;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // 2. Envío de Respaldo al Servidor
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/guardar-csv-respaldo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombreArchivo: nombreArchivo, contenido: csvContent })
                });
                if (res.ok) { alert(`CSV descargado localmente y respaldado en servidor como: ${nombreArchivo}`); }
                else { alert("CSV descargado localmente (No se pudo conectar al servidor)"); }
            } catch (e) {
                alert("CSV descargado localmente (Servidor Offline)");
            }
        }

        setInterval(comprobarConexion, 5000);
        guardarYRenderizar();
        comprobarConexion();
    </script>
</body>
</html>
