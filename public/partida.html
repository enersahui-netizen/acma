<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida - ACMA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 1.5rem;
            margin: 0;
        }
        .estado {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .online {
            background: #28a745;
        }
        .offline {
            background: #dc3545;
        }
        .reloj {
            font-size: 3rem;
            color: #00ff66;
            text-align: center;
            margin: 20px 0;
            font-family: monospace;
            font-weight: bold;
        }
        .input-grande {
            font-size: 2rem;
            padding: 20px;
            text-align: center;
            border: 3px solid #00ff66;
            background: #1a1a1a;
            color: #00ff66;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .input-grande:focus {
            outline: none;
            border-color: #00dd55;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
        .btn-largada {
            width: 100%;
            padding: 20px;
            background: #00ff66;
            color: #000;
            font-weight: bold;
            font-size: 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .btn-largada:hover {
            background: #00dd55;
            transform: scale(1.02);
        }
        .btn-largada:active {
            transform: scale(0.98);
        }
        .btn-finalizar {
            width: 100%;
            padding: 12px;
            background: #ff9900;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .tabla-rapida {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            margin-top: 20px;
        }
        .tabla-rapida h3 {
            color: #00ff66;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .fila-auto {
            background: #252525;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }
        .fila-auto strong {
            color: #00ff66;
        }
        .fila-auto .hora {
            color: #aaa;
            font-size: 0.85rem;
        }
        .fila-auto .estado {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
        }
        .estado-ok {
            background: #28a745;
        }
        .estado-pendiente {
            background: #ffc107;
            color: #000;
        }
        .info {
            background: #1a3a1a;
            border-left: 3px solid #00ff66;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🟢 PARTIDA</h2>
            <span id="indicador-estado" class="estado offline">OFFLINE</span>
        </div>

        <div class="reloj" id="reloj-oficial">00:00:00</div>

        <div class="info">
            <strong>⚡ RÁPIDO:</strong> Selecciona tramo, ingresa nº auto y presiona LARGADA
        </div>

        <div style="margin-bottom: 15px;">
            <label style="color: #aaa; margin-bottom: 5px; display: block;">TRAMO:</label>
            <select id="tramo" style="width: 100%; padding: 12px; background: #1a1a1a; color: #00ff66; border: 2px solid #00ff66; border-radius: 6px; font-size: 1.1rem; font-weight: bold;">
                <option value="">-- Seleccionar Tramo --</option>
                <option value="PE-01">PE-01</option>
                <option value="PE-02">PE-02</option>
                <option value="PE-03">PE-03</option>
                <option value="PE-04">PE-04</option>
                <option value="PE-05">PE-05</option>
            </select>
        </div>

        <input type="number" id="num_auto" class="input-grande" placeholder="Nº AUTO" inputmode="numeric" autofocus>

        <button class="btn-largada" onclick="darLargada()">🟢 DAR LARGADA</button>

        <button class="btn-finalizar" onclick="finalizarTramo()">📦 FINALIZAR TRAMO</button>

        <div class="tabla-rapida">
            <h3>ÚLTIMOS 10 REGISTROS</h3>
            <div id="ultimos-autos"></div>
        </div>
    </div>

    <script>
        const URL_SERVIDOR = window.location.origin;
        let historialLocal = JSON.parse(localStorage.getItem('partidas_local') || "[]");

        function actualizarReloj() {
            document.getElementById('reloj-oficial').innerText = new Date().toTimeString().split(' ')[0];
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        async function comprobarConexion() {
            const badge = document.getElementById('indicador-estado');
            try {
                const res = await fetch(`${URL_SERVIDOR}/`, { method: 'HEAD' });
                if (res.ok) {
                    badge.innerText = "ONLINE";
                    badge.className = "estado online";
                    await sincronizarPendientes();
                } else throw new Error();
            } catch (e) {
                badge.innerText = "OFFLINE";
                badge.className = "estado offline";
            }
        }

        async function darLargada() {
            const auto = document.getElementById('num_auto').value.trim();
            const tramo = document.getElementById('tramo').value.trim();
            
            if (!tramo) {
                alert("Selecciona un tramo");
                document.getElementById('tramo').focus();
                return;
            }

            if (!auto) {
                alert("Ingresa el número de auto");
                document.getElementById('num_auto').focus();
                return;
            }

            // Validar que exista el participante
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/participante/${auto}`);
                const data = await res.json();
                if (!data.ok || !data.participante) {
                    alert(`⚠️ Auto #${auto} NO ENCONTRADO\n\nRegístralo en:\nREGISTRO DE PARTICIPANTES`);
                    document.getElementById('num_auto').value = '';
                    document.getElementById('num_auto').focus();
                    return;
                }
            } catch (e) {
                console.log("Verificación offline");
            }

            const hora = new Date().toLocaleTimeString('es-PE', { hour12: false }) + '.' + new Date().getMilliseconds().toString().padStart(3, '0');

            const registro = {
                id: Date.now(),
                auto: auto,
                tramo: tramo,
                hora: hora,
                tipo: 'partida',
                enviado: false
            };

            historialLocal.unshift(registro);
            guardarYRenderizar();
            document.getElementById('num_auto').value = '';
            document.getElementById('num_auto').focus();
            await sincronizarPendientes();
        }

        async function sincronizarPendientes() {
            for (let item of historialLocal) {
                if (!item.enviado) {
                    try {
                        const res = await fetch(`${URL_SERVIDOR}/api/partida`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                auto: item.auto,
                                tramo: item.tramo,
                                hora: item.hora,
                                juez: 'Juez de Partida'
                            })
                        });
                        
                        const data = await res.json();
                        
                        if (data.ok) {
                            item.enviado = true;
                        } else {
                            // Error del servidor - mostrar y eliminar del historial
                            alert("❌ " + data.error);
                            historialLocal = historialLocal.filter(h => h.id !== item.id);
                            break;
                        }
                    } catch (e) {
                        console.log("Error de sincronización:", e);
                        break;
                    }
                }
            }
            guardarYRenderizar();
        }

        function guardarYRenderizar() {
            localStorage.setItem('partidas_local', JSON.stringify(historialLocal));
            
            const div = document.getElementById('ultimos-autos');
            const ultimos = historialLocal.slice(0, 10);
            
            if (ultimos.length === 0) {
                div.innerHTML = '<div style="color: #666; text-align: center;">Sin registros</div>';
                return;
            }

            div.innerHTML = ultimos.map(item => `
                <div class="fila-auto">
                    <strong>#${item.auto}</strong>
                    <span class="hora">${item.hora}</span>
                    <span class="estado ${item.enviado ? 'estado-ok' : 'estado-pendiente'}">
                        ${item.enviado ? '✅' : '⏳'}
                    </span>
                </div>
            `).join('');
        }

        async function finalizarTramo() {
            if (historialLocal.length === 0) {
                alert("No hay registros");
                return;
            }

            const tramo = document.getElementById('tramo').value;
            if (!tramo) {
                alert("Selecciona un tramo");
                return;
            }

            try {
                // Exportar a Excel
                const url = `${URL_SERVIDOR}/api/exportar-excel-respaldo/${tramo}`;
                const response = await fetch(url);
                if (response.ok) {
                    const blob = await response.blob();
                    const link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = `partida-${tramo}.xlsx`;
                    link.click();
                    
                    alert(`✅ Tramo ${tramo} finalizado\n\n${historialLocal.length} partidas registradas\n\nArchivo descargado y guardado en servidor`);
                    
                    // Limpiar historial
                    historialLocal = [];
                    localStorage.removeItem('partidas_local');
                    guardarYRenderizar();
                } else {
                    alert('❌ Error al generar respaldo Excel');
                }
            } catch (e) {
                alert('❌ Error: ' + e.message);
            }
        }

        setInterval(comprobarConexion, 5000);
        guardarYRenderizar();
        comprobarConexion();

        // Sincronización automática cada 5 segundos
        setInterval(comprobarConexion, 5000);
        
        // Guardar en localStorage antes de cerrar
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('partidas_local', JSON.stringify(historialLocal));
        });

        // Auto-focus en input
        document.getElementById('num_auto').focus();
    </script>

</body>
</html>
