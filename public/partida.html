<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partida - Cronometraje</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 15px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-bottom: 3px solid #00e676; }
    .badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; background: #ff9100; color: #000; }
    .badge.online { background: #00e676; }
    .reloj-box { background: #000; border: 2px solid #333; text-align: center; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
    .reloj { font-size: 42px; font-weight: bold; font-family: monospace; color: #00e676; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; text-transform: uppercase; }
    input, select { width: 100%; padding: 14px; background: #222; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 18px; }
    input:focus, select:focus { border-color: #00e676; outline: none; }
    .btn-largada { width: 100%; padding: 20px; background: #00e676; color: #000; border: none; border-radius: 12px; font-size: 24px; font-weight: bold; text-transform: uppercase; margin-top: 10px; cursor: pointer; }
    .btn-largada:active { background: #00b0ff; }
    .tabla-historial { margin-top: 25px; width: 100%; border-collapse: collapse; font-size: 14px; }
    .tabla-historial th, .tabla-historial td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    .tabla-historial th { background: #222; color: #aaa; }
  </style>
</head>
<body>

  <div class="header">
    <h3>🏁 PARTIDA</h3>
    <span id="estado-red" class="badge">OFFLINE</span>
  </div>

  <div class="reloj-box">
    <div style="font-size: 12px; color: #888;">HORA OFICIAL (LAPT)</div>
    <div id="reloj" class="reloj">00:00:00</div>
  </div>

  <div class="form-group">
    <label>TRAMO (PE):</label>
    <input type="text" id="tramo" value="PE-01">
  </div>

  <div class="form-group">
    <label>N° DE VEHÍCULO (AUTO):</label>
    <input type="number" id="num-auto" placeholder="Ej: 402" inputmode="numeric">
  </div>

  <div class="form-group">
    <label>CATEGORÍA DEL VEHÍCULO:</label>
    <select id="categoria">
      <option value="Turismo 1600cc">Turismo 1600cc</option>
      <option value="S2000 / 4x4">S2000 / Tracción Total</option>
      <option value="UTV / Bugs">UTV / Bugs</option>
      <option value="Camionetas">Camionetas / 4x4</option>
      <option value="General">General / Libre</option>
    </select>
  </div>

  <button class="btn-largada" onclick="darLargada()">🟢 DAR LARGADA</button>

  <h4 style="margin-top: 30px; color: #aaa;">REGISTRADOS EN ESTE CELULAR</h4>
  <table class="tabla-historial">
    <thead>
      <tr>
        <th>Auto</th>
        <th>Cat.</th>
        <th>Hora Partida</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="historial-body"></tbody>
  </table>

  <script>
    // CAMBIA ESTA URL POR LA DIRECCIÓN DE NGROK CUANDO CONECTES CON LA LAPTOP
    const URL_SERVIDOR = "https://acma-baf9.onrender.com"; 
    
    let historialLocal = JSON.parse(localStorage.getItem('partidas_local') || '[]');

    function actualizarReloj() {
      const ahora = new Date();
      const pad = (n) => n.toString().padStart(2, '0');
      document.getElementById('reloj').innerText = `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}:${pad(ahora.getSeconds())}`;
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    async function darLargada() {
      const numAuto = document.getElementById('num-auto').value;
      const tramo = document.getElementById('tramo').value;
      const categoria = document.getElementById('categoria').value;

      if (!numAuto) {
        alert("Por favor, ingresa el número del vehículo.");
        return;
      }

      const ahora = new Date();
      const pad = (n, z = 2) => n.toString().padStart(z, '0');
      const padMs = (n) => n.toString().padStart(3, '0');
      
      const horaFormateada = `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}:${pad(ahora.getSeconds())}.${padMs(ahora.getMilliseconds())}`;
      const msPartida = ahora.getTime();

      const registro = {
        tramo_id: tramo,
        auto: numAuto,
        categoria: categoria,
        hora_partida: horaFormateada,
        ms_partida: msPartida,
        enviado: false
      };

      historialLocal.unshift(registro);
      localStorage.setItem('partidas_local', JSON.stringify(historialLocal));
      actualizarTabla();
      document.getElementById('num-auto').value = '';

      enviarAlServidor(registro);
    }

    async function enviarAlServidor(registro) {
      try {
        const respuesta = await fetch(`${URL_SERVIDOR}/api/partida`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(registro)
        });

        if (respuesta.ok) {
          registro.enviado = true;
          document.getElementById('estado-red').innerText = "ONLINE";
          document.getElementById('estado-red').className = "badge online";
          localStorage.setItem('partidas_local', JSON.stringify(historialLocal));
          actualizarTabla();
        }
      } catch (e) {
        document.getElementById('estado-red').innerText = "OFFLINE";
        document.getElementById('estado-red').className = "badge";
      }
    }

    function actualizarTabla() {
      const body = document.getElementById('historial-body');
      body.innerHTML = '';
      historialLocal.forEach(reg => {
        const fila = `<tr>
          <td><b>#${reg.auto}</b></td>
          <td>${reg.categoria}</td>
          <td>${reg.hora_partida}</td>
          <td>${reg.enviado ? '✅ Recibido' : '⏳ Pendiente'}</td>
        </tr>`;
        body.innerHTML += fila;
      });
    }

    actualizarTabla();
  </script>
</body>
</html>
