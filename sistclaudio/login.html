<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ACMA Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
        }
        .login-container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .logo p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #f8fafc;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: none;
            font-size: 0.9rem;
        }
        .error.show {
            display: block;
        }
        .enlaces {
            text-align: center;
            margin-top: 20px;
        }
        .enlaces a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        .enlaces a:hover {
            color: #0284c7;
        }
        .credenciales-demo {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            color: #86efac;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-login.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <h1>🏁 ACMA</h1>
            <p>Sistema de Tiempos Rally</p>
        </div>

        <div class="error" id="error-msg"></div>

        <form onsubmit="login(event)">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingrese usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese contraseña" required>
            </div>

            <button type="submit" class="btn-login" id="btn-login">
                <span id="btn-text">🔓 INGRESAR</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="credenciales-demo">
            <strong>🔑 Credenciales Demo:</strong><br>
            Usuario: <code>admin</code><br>
            Contraseña: <code>admin123</code>
        </div>

        <div class="enlaces">
            <a href="/">← Volver al inicio</a>
        </div>
    </div>

    <script>
        const URL_SERVIDOR = window.location.origin;

        async function login(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');
            const btn = document.getElementById('btn-login');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');

            // Mostrar spinner
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Autenticando...';
            errorDiv.classList.remove('show');

            try {
                const res = await fetch(`${URL_SERVIDOR}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!data.ok) {
                    throw new Error(data.error || "Error de autenticación");
                }

                // Guardar token y redirigir
                localStorage.setItem('acma_token', data.token);
                localStorage.setItem('acma_rol', data.rol);
                
                setTimeout(() => {
                    window.location.href = '/laptop';
                }, 500);

            } catch (error) {
                errorDiv.textContent = "❌ " + error.message;
                errorDiv.classList.add('show');
                
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = '🔓 INGRESAR';
            }
        }

        // Verificar si ya está logueado
        const token = localStorage.getItem('acma_token');
        if (token) {
            window.location.href = '/laptop';
        }
    </script>

</body>
</html>
