<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Director de Carrera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 20px;
            border-radius: 12px;
            border-bottom: 2px solid #38bdf8;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin: 0;
        }
        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .estado-conexion {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .estado-conexion.online {
            background: #10b981;
        }
        .estado-conexion.offline {
            background: #ef4444;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-logout:hover {
            background: #dc2626;
            transform: scale(1.05);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .grid.full { grid-template-columns: 1fr; }
        .card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .card h2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            margin-top: 0;
            font-size: 1.2rem;
        }
        .badge {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .badge-partida {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        .badge-llegada {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        thead {
            background: rgba(15, 23, 42, 0.8);
        }
        th {
            padding: 12px;
            text-align: left;
            color: #94a3b8;
            font-weight: 600;
            border-bottom: 2px solid #334155;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #334155;
        }
        tbody tr:hover {
            background: rgba(56, 189, 248, 0.05);
        }
        tbody tr:nth-child(even) {
            background: rgba(15, 23, 42, 0.3);
        }
        .respaldos {
            margin-top: 20px;
        }
        .respaldos-list {
            list-style: none;
        }
        .respaldos-list li {
            background: rgba(15, 23, 42, 0.5);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #38bdf8;
        }
        .btn-descargar {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .btn-descargar:hover {
            background: #0369a1;
            transform: scale(1.05);
        }
        .sin-datos {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            font-style: italic;
        }
        .indicador-actualizacion {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .filtros {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .filtro-group {
            display: flex;
            flex-direction: column;
        }
        .filtro-group label {
            color: #cbd5e1;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .filtro-group select {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>💻 DASHBOARD - DIRECTOR DE CARRERA</h1>
                <p style="color: #94a3b8; margin: 5px 0 0 0;">Monitoreo en vivo de todas las competiciones</p>
            </div>
            <div class="header-actions">
                <div id="estado-ws" class="estado-conexion online">
                    <span class="indicador-actualizacion"></span>EN VIVO
                </div>
                <button class="btn-logout" onclick="logout()">🚪 LOGOUT</button>
            </div>
        </div>

        <div class="filtros">
            <div class="filtro-group">
                <label for="filtro-tramo">Tramo</label>
                <select id="filtro-tramo" onchange="aplicarFiltros()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filtro-group">
                <label for="filtro-ciudad">Ciudad</label>
                <select id="filtro-ciudad" onchange="aplicarFiltros()">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="filtro-group">
                <label for="filtro-categoria">Categoría</label>
                <select id="filtro-categoria" onchange="aplicarFiltros()">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="filtro-group">
                <label>&nbsp;</label>
                <button style="background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;" onclick="limpiarFiltros()">Limpiar Filtros</button>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>
                    <span>🟢 PARTIDAS <span class="badge badge-partida" id="cant-partidas">0</span></span>
                    <span class="indicador-actualizacion"></span>
                </h2>
                <table>
                    <thead>
                        <tr>
                            <th>Auto</th>
                            <th>Piloto</th>
                            <th>Tramo</th>
                            <th>Hora</th>
                            <th>Ciudad</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-partidas">
                        <tr><td colspan="5" class="sin-datos">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h2>
                    <span>🛑 LLEGADAS <span class="badge badge-llegada" id="cant-llegadas">0</span></span>
                    <span class="indicador-actualizacion"></span>
                </h2>
                <table>
                    <thead>
                        <tr>
                            <th>Auto</th>
                            <th>Piloto</th>
                            <th>Tramo</th>
                            <th>Hora</th>
                            <th>Juez</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-llegadas">
                        <tr><td colspan="5" class="sin-datos">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card full respaldos">
            <h2>📦 RESPALDOS EN SERVIDOR (.XLSX)</h2>
            <ul class="respaldos-list" id="lista-archivos">
                <li class="sin-datos">Buscando respaldos...</li>
            </ul>
        </div>
    </div>

    <script>
        const URL_SERVIDOR = window.location.origin;
        let ws = null;
        let datosPartidas = [];
        let datosLlegadas = [];
        let filtrosActuales = { tramo: '', ciudad: '', categoria: '' };

        // Verificar autenticación
        function verificarAutenticacion() {
            const token = localStorage.getItem('acma_token');
            if (!token) {
                window.location.href = '/login';
                return false;
            }
            return token;
        }

        // Conectar WebSocket
        function conectarWebSocket() {
            const protocolo = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocolo}//${window.location.host}`);

            ws.onopen = () => {
                console.log("✅ WebSocket conectado");
                document.getElementById('estado-ws').className = 'estado-conexion online';
                cargarDatos();
                cargarRespaldos();
            };

            ws.onmessage = (event) => {
                const mensaje = JSON.parse(event.data);
                if (mensaje.evento === 'nueva_partida') {
                    datosPartidas.unshift(mensaje.datos);
                    renderizarDatos();
                } else if (mensaje.evento === 'nueva_llegada') {
                    datosLlegadas.unshift(mensaje.datos);
                    renderizarDatos();
                }
            };

            ws.onerror = () => {
                console.error("❌ Error WebSocket");
                document.getElementById('estado-ws').className = 'estado-conexion offline';
            };

            ws.onclose = () => {
                console.log("❌ WebSocket desconectado");
                document.getElementById('estado-ws').className = 'estado-conexion offline';
                setTimeout(conectarWebSocket, 3000);
            };
        }

        async function cargarDatos() {
            const token = verificarAutenticacion();
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/obtener-datos-vivo`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                datosPartidas = data.partidas || [];
                datosLlegadas = data.llegadas || [];
                renderizarDatos();
                cargarFiltros();
            } catch (e) {
                console.error("Error cargando datos:", e);
            }
        }

        async function cargarFiltros() {
            try {
                const [tramos, ciudades, categorias] = await Promise.all([
                    fetch(`${URL_SERVIDOR}/api/tramos`).then(r => r.json()),
                    fetch(`${URL_SERVIDOR}/api/ciudades`).then(r => r.json()),
                    fetch(`${URL_SERVIDOR}/api/categorias`).then(r => r.json())
                ]);

                const selectTramo = document.getElementById('filtro-tramo');
                tramos.tramos?.forEach(t => {
                    if (!selectTramo.querySelector(`option[value="${t}"]`)) {
                        selectTramo.innerHTML += `<option value="${t}">${t}</option>`;
                    }
                });

                const selectCiudad = document.getElementById('filtro-ciudad');
                ciudades.ciudades?.forEach(c => {
                    if (!selectCiudad.querySelector(`option[value="${c}"]`)) {
                        selectCiudad.innerHTML += `<option value="${c}">${c}</option>`;
                    }
                });

                const selectCategoria = document.getElementById('filtro-categoria');
                categorias.categorias?.forEach(c => {
                    if (!selectCategoria.querySelector(`option[value="${c}"]`)) {
                        selectCategoria.innerHTML += `<option value="${c}">${c}</option>`;
                    }
                });
            } catch (e) {
                console.error("Error cargando filtros:", e);
            }
        }

        function renderizarDatos() {
            // Aplicar filtros
            let partidas = datosPartidas;
            let llegadas = datosLlegadas;

            if (filtrosActuales.tramo) {
                partidas = partidas.filter(p => p.tramo === filtrosActuales.tramo);
                llegadas = llegadas.filter(l => l.tramo === filtrosActuales.tramo);
            }
            if (filtrosActuales.ciudad) {
                partidas = partidas.filter(p => p.ciudad === filtrosActuales.ciudad);
                llegadas = llegadas.filter(l => l.ciudad === filtrosActuales.ciudad);
            }
            if (filtrosActuales.categoria) {
                partidas = partidas.filter(p => p.categoria === filtrosActuales.categoria);
            }

            // Renderizar partidas
            document.getElementById('cant-partidas').textContent = partidas.length;
            document.getElementById('tabla-partidas').innerHTML = partidas.length === 0
                ? '<tr><td colspan="5" class="sin-datos">Sin datos</td></tr>'
                : partidas.map(p => `
                    <tr>
                        <td><strong>#${p.auto}</strong></td>
                        <td>${p.piloto || '-'}</td>
                        <td>${p.tramo}</td>
                        <td>${p.hora}</td>
                        <td>${p.ciudad || '-'}</td>
                    </tr>
                `).join('');

            // Renderizar llegadas
            document.getElementById('cant-llegadas').textContent = llegadas.length;
            document.getElementById('tabla-llegadas').innerHTML = llegadas.length === 0
                ? '<tr><td colspan="5" class="sin-datos">Sin datos</td></tr>'
                : llegadas.map(l => `
                    <tr>
                        <td><strong>#${l.auto}</strong></td>
                        <td>${l.piloto || '-'}</td>
                        <td>${l.tramo}</td>
                        <td>${l.hora}</td>
                        <td>${l.juez || '-'}</td>
                    </tr>
                `).join('');
        }

        async function cargarRespaldos() {
            try {
                const res = await fetch(`${URL_SERVIDOR}/api/lista-respaldos`);
                const archivos = await res.json();

                document.getElementById('lista-archivos').innerHTML = archivos.length === 0
                    ? '<li class="sin-datos">No hay respaldos todavía</li>'
                    : archivos.map(a => `
                        <li>
                            📄 <strong>${a}</strong>
                            <a class="btn-descargar" href="/api/descargar-respaldo/${a}">Descargar</a>
                        </li>
                    `).join('');
            } catch (e) {
                console.error("Error respaldos:", e);
            }
        }

        function aplicarFiltros() {
            filtrosActuales.tramo = document.getElementById('filtro-tramo').value;
            filtrosActuales.ciudad = document.getElementById('filtro-ciudad').value;
            filtrosActuales.categoria = document.getElementById('filtro-categoria').value;
            renderizarDatos();
        }

        function limpiarFiltros() {
            filtrosActuales = { tramo: '', ciudad: '', categoria: '' };
            document.getElementById('filtro-tramo').value = '';
            document.getElementById('filtro-ciudad').value = '';
            document.getElementById('filtro-categoria').value = '';
            renderizarDatos();
        }

        function logout() {
            if (confirm("¿Cerrar sesión?")) {
                localStorage.removeItem('acma_token');
                localStorage.removeItem('acma_rol');
                window.location.href = '/login';
            }
        }

        // Iniciar
        if (verificarAutenticacion()) {
            conectarWebSocket();
            setInterval(() => {
                cargarRespaldos();
            }, 5000);
        }
    </script>

</body>
</html>
