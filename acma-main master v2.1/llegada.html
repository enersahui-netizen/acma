<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llegada - ACMA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 1.5rem;
            margin: 0;
        }
        .estado {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .online {
            background: #28a745;
        }
        .offline {
            background: #dc3545;
        }
        .reloj {
            font-size: 3rem;
            color: #ff3366;
            text-align: center;
            margin: 20px 0;
            font-family: monospace;
            font-weight: bold;
        }
        .input-grande {
            font-size: 2rem;
            padding: 20px;
            text-align: center;
            border: 3px solid #ff3366;
            background: #1a1a1a;
            color: #ff3366;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .input-grande:focus {
            outline: none;
            border-color: #ff1a4d;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }
        .btn-llegada {
            width: 100%;
            padding: 20px;
            background: #ff3366;
            color: #fff;
            font-weight: bold;
            font-size: 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .btn-llegada:hover {
            background: #ff1a4d;
            transform: scale(1.02);
        }
        .btn-llegada:active {
            transform: scale(0.98);
        }
        .btn-finalizar {
            width: 100%;
            padding: 12px;
            background: #ff9900;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .tabla-rapida {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            margin-top: 20px;
        }
        .tabla-rapida h3 {
            color: #ff3366;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .fila-auto {
            background: #252525;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }
        .fila-auto strong {
            color: #ff3366;
        }
        .fila-auto .hora {
            color: #aaa;
            font-size: 0.85rem;
        }
        .fila-auto .estado {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
        }
        .estado-ok {
            background: #28a745;
        }
        .estado-pendiente {
            background: #ffc107;
            color: #000;
        }
        .info {
            background: #3a1a1a;
            border-left: 3px solid #ff3366;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🛑 LLEGADA</h2>
            <span id="indicador-estado" class="estado offline">OFFLINE</span>
        </div>

        <div class="reloj" id="reloj-oficial">00:00:00</div>

        <div class="info">
            <strong>⚡ RÁPIDO:</strong> Solo ingresa nº auto y presiona LLEGADA
        </div>

        <input type="number" id="num_auto" class="input-grande" placeholder="Nº AUTO" inputmode="numeric" autofocus>

        <button class="btn-llegada" onclick="registrarLlegada()">🛑 REGISTRAR LLEGADA</button>

        <button class="btn-finalizar" onclick="finalizarTramo()">📦 FINALIZAR TRAMO</button>

        <div class="tabla-rapida">
            <h3>ÚLTIMAS 10 LLEGADAS</h3>
            <div id="ultimas-llegadas"></div>
        </div>
    </div>

    <script>
        const URL_SERVIDOR = window.location.origin;
        let historialLocal = JSON.parse(localStorage.getItem('llegadas_local') || "[]");

        function actualizarReloj() {
            document.getElementById('reloj-oficial').innerText = new Date().toTimeString().split(' ')[0];
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        async function comprobarConexion() {
            const badge = document.getElementById('indicador-estado');
            try {
                const res = await fetch(`${URL_SERVIDOR}/`, { method: 'HEAD' });
                if (res.ok) {
                    badge.innerText = "ONLINE";
                    badge.className = "estado online";
                    await sincronizarPendientes();
                } else throw new Error();
            } catch (e) {
                badge.innerText = "OFFLINE";
                badge.className = "estado offline";
            }
        }

        async function registrarLlegada() {
            const auto = document.getElementById('num_auto').value.trim();
            
            if (!auto) {
                alert("Ingresa el número de auto");
                document.getElementById('num_auto').focus();
                return;
            }

            const hora = new Date().toLocaleTimeString('es-PE', { hour12: false }) + '.' + new Date().getMilliseconds().toString().padStart(3, '0');

            const registro = {
                id: Date.now(),
                auto: auto,
                hora: hora,
                tipo: 'llegada',
                enviado: false
            };

            historialLocal.unshift(registro);
            guardarYRenderizar();
            document.getElementById('num_auto').value = '';
            document.getElementById('num_auto').focus();
            await sincronizarPendientes();
        }

        async function sincronizarPendientes() {
            for (let item of historialLocal) {
                if (!item.enviado) {
                    try {
                        // Determinar tramo de la URL o usar default
                        const urlParams = new URLSearchParams(window.location.search);
                        const tramo = urlParams.get('tramo') || 'PE-01';

                        const res = await fetch(`${URL_SERVIDOR}/api/llegada`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                auto: item.auto,
                                tramo: tramo,
                                hora: item.hora,
                                juez: 'Juez de Llegada'
                            })
                        });
                        if (res.ok) item.enviado = true;
                    } catch (e) {
                        break;
                    }
                }
            }
            guardarYRenderizar();
        }

        function guardarYRenderizar() {
            localStorage.setItem('llegadas_local', JSON.stringify(historialLocal));
            
            const div = document.getElementById('ultimas-llegadas');
            const ultimas = historialLocal.slice(0, 10);
            
            if (ultimas.length === 0) {
                div.innerHTML = '<div style="color: #666; text-align: center;">Sin registros</div>';
                return;
            }

            div.innerHTML = ultimas.map(item => `
                <div class="fila-auto">
                    <strong>#${item.auto}</strong>
                    <span class="hora">${item.hora}</span>
                    <span class="estado ${item.enviado ? 'estado-ok' : 'estado-pendiente'}">
                        ${item.enviado ? '✅' : '⏳'}
                    </span>
                </div>
            `).join('');
        }

        async function finalizarTramo() {
            if (historialLocal.length === 0) {
                alert("No hay registros");
                return;
            }

            alert(`✅ Tramo finalizado con ${historialLocal.length} llegadas registradas.\n\nSincronización completada.`);
            historialLocal = [];
            localStorage.removeItem('llegadas_local');
            guardarYRenderizar();
        }

        setInterval(comprobarConexion, 5000);
        guardarYRenderizar();
        comprobarConexion();

        // Auto-focus en input
        document.getElementById('num_auto').focus();
    </script>

</body>
</html>
